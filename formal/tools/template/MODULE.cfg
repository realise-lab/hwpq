# Proof config: @MODULE@
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# Add a white-box addendum's spec and bind to sources below if this module
# keeps internal state the interface does not fully determine.

# sources
source              hwpq/@MODULE@/src/@MODULE@.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/@MODULE@_bind.sv

# elaborate
# QUEUE_SIZE is structurally constrained per family: even for the array
# designs, 2^k-1 for the tree designs. Keep geometry small; these proofs are
# about protocol, not width.
top                 hwpq_rst_@MODULE@
param               QUEUE_SIZE 7
param               DATA_WIDTH 3
param               ENQ_ENA    1

# time and reset
clock               i_CLK
reset               ~i_init_RSTn

# prove, gate, exit
module              @MODULE@
allow_bounded       0
# Leave empty unless --ungated is expected to reproduce a recorded shortcoming.
expect_cex
