# Proof config: register_tree, ENQ_ENA=0 (replace-only build)
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# A SEPARATE RUN, NOT A VARIANT. Reset fills every node with all-ones while size
# resets to 0 (register_tree.sv:94-99), so the tree boots physically full but
# logically empty and each replace evicts one placeholder. There is no enqueue
# datapath, so a bare write is not a command this build has.
#
# The spec's ASSUME_FILL_FIRST constrains this build to the initialisation
# convention - do not read before the queue has been filled once. Without it
# this reproduces the same counterexamples as register_array_enq0; the sentinel
# idiom is duplicated verbatim across both families.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/register_tree/src/register_tree.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/register_tree_bind.sv
source              formal/spec/hwpq_tree_aux.sv
source              formal/bind/register_tree_aux_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# Same sizes as the ENQ_ENA=1 run; only the reset fill and the command set move.
top                 hwpq_rst_register_tree
param               QUEUE_SIZE 7
param               DATA_WIDTH 3
param               ENQ_ENA 0

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              register_tree_enq0
allow_bounded       0
# Same mechanism as register_array_enq0.cfg: dropping ASSUME_FILL_FIRST exposes
# a_occ_empty_agrees and a_no_loss. Matching is by NAME, not defect identity.
expect_cex_ungated  a_occ_empty_agrees a_no_loss
