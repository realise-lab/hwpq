# Proof config: systolic_array
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# The fifth architecture, and the first whose readies are not a clean busy
# decode over a settled/unsettled state machine. See formal/bind/
# systolic_array_bind.sv for why HAS_FULL=1 is reached through CAPACITY and why
# MAX_SETTLE is a literal.
#
# o_write_ready and enqueue acceptance are derived from the same `full` signal,
# so the spec's reconstruction of acceptance from the readies is exact here.
#
# `size` is declared `int` - 32 bits of state where 4 would do. If the proof will
# not converge, that is the first thing to look at.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/systolic_array/src/systolic_array.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/systolic_array_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# QUEUE_SIZE must be EVEN: the array is split into an input and an output buffer
# of HALF_SIZE = QUEUE_SIZE/2 each. It must also leave room for the shifting
# network's slack slots, which cost 2 of the nominal size - so 8 is the smallest
# value with any usable capacity at all (effective capacity QUEUE_SIZE-2 = 6).
top                 hwpq_rst_systolic_array
param               QUEUE_SIZE 8
param               DATA_WIDTH 3

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              systolic_array
allow_bounded       0
# No workaround assumption applies here: the spec's acceptance decode is exact,
# so --ungated is a no-op for this config.
expect_cex
