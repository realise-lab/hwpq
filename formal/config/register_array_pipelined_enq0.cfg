# Proof config: register_array_pipelined, ENQ_ENA=0 (replace-only build)
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# A SEPARATE RUN, NOT A VARIANT. Reset fills the array with all-ones while size
# resets to 0 (register_array_pipelined.sv:56-64), so the queue boots physically
# full but logically empty and each replace evicts one placeholder. There is no
# enqueue datapath, so a bare write is not a command this build has.
#
# The sentinel idiom is duplicated verbatim from register_array, so this is
# expected to behave exactly like register_array_enq0 when ASSUME_FILL_FIRST is
# dropped. The difference is HAS_BUSY: this design drops both readies
# mid-operation, so the fill-first flag has to latch on
# `settled && !o_write_ready` rather than `!o_write_ready` alone.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/register_array_pipelined/src/register_array_pipelined.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/register_array_pipelined_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# Same sizes as the ENQ_ENA=1 run; only the reset fill and the command set move.
# QUEUE_SIZE must be EVEN: the design pairs elements (PAIR_COUNT = QUEUE_SIZE/2).
top                 hwpq_rst_register_array_pipelined
param               QUEUE_SIZE 4
param               DATA_WIDTH 3
param               ENQ_ENA 0

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              register_array_pipelined_enq0
allow_bounded       0

# Same mechanism as register_array_enq0.cfg: dropping ASSUME_FILL_FIRST exposes
# a_occ_empty_agrees and a_no_loss. Matching is by NAME, not defect identity.
expect_cex_ungated  a_occ_empty_agrees a_no_loss
