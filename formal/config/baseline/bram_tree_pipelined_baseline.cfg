# Proof config: bram_tree_pipelined (replace-only; the module has no enqueue path)
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# Three things make it unlike the register modules:
#
#   Memory is not reset state. A formal tool ignores the `initial` block that
#   fills the RAMs, so they start arbitrary. This config assumes nothing about
#   that and sources no addendum: the baseline RTL has no reset fill sequencer
#   either, so failing to establish the memory is part of the behaviour being
#   recorded. Read every result here as black-box only.
#
#   o_write_ready is not a fullness signal. The word "full" does not appear in
#   the source; there is no enqueue datapath and a replace on a populated queue
#   is size-neutral, so no command it accepts has fullness as a precondition.
#   Hence HAS_FULL=0 with CAPACITY=QUEUE_SIZE. The main config's addendum states
#   what the port does mean and recovers the covers HAS_FULL=0 drops; this config
#   runs without either.
#
#   Several out-of-range index expressions the tool warns about are left in the
#   RTL and decided by property instead of patched blind.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/bram_tree_pipelined/src/comparator.sv
source              hwpq/bram_tree_pipelined/src/rams_tdp_rf_rf.sv
source              hwpq/bram_tree_pipelined/src/bram_tree_pipelined.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/baseline/bram_tree_pipelined_baseline_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# QUEUE_SIZE must be 2^k - 1 for the tree designs, so the choice is 7 or 15.
#
# 15 DOES NOT CONVERGE. These proofs are dominated by finding cover witnesses,
# and at 15 the queue holds fifteen elements at up to 18 cycles per operation, so
# demonstrating that it can fill needs roughly 270 cycles of bounded
# reachability.
#
# 7 gives TREE_DEPTH=3 and exactly one BRAM level, which is the cost: the second
# level, and any defect that needs two, is out of scope here.
#
# DATA_WIDTH 2, NOT 3 as everywhere else: a real reduction in strength, not a
# free choice. With '0 and all-ones reserved the legal alphabet is 2**2 - 2 =
# TWO values, so an ordering property can still tell a maximum from a
# non-maximum but cannot distinguish degrees of ordering among three or more
# distinct payloads. The engines have to search this design's memory contents,
# and a_no_loss, a_head_is_max and a_head_present (the spec properties that
# track a symbolic value through the whole queue) do not converge at width 3
# within the default ceiling. Raising the ceiling instead is the wrong answer: a
# proof past the ceiling is mis-sized, not slow.
#
# The top is the reset harness, not the DUT: see the harness comment in
# formal/bind/baseline/bram_tree_pipelined_baseline_bind.sv.
top                 hwpq_rst_bram_tree_pipelined
param               QUEUE_SIZE 7
param               DATA_WIDTH 2

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              bram_tree_pipelined_baseline
allow_bounded       0

# Ungated runs must reproduce EXACTLY these and nothing else. If one stops firing
# the assumption should be retired; if a new one appears, something regressed.
# Either way the run fails and says which.
#
# Same mechanism as register_array_enq0.cfg: dropping ASSUME_FILL_FIRST (the
# only thing --ungated drops here) exposes a_occ_empty_agrees and a_no_loss.
# Both fire deeper here than in the register modules, since this module's reset
# sweep and per-operation latency are both longer, not because the defect
# differs. Matching is by NAME, not defect identity.
expect_cex_ungated  a_occ_empty_agrees a_no_loss
