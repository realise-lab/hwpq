# Proof config: bram_tree (enqueue-capable; both command forms live)
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# THIS RUN IS EXPECTED TO FAIL, and to fail before it proves anything. The
# module's RAM model drives its array from two `always` blocks, so the
# multiply-driven-design gate refuses it. The run is committed in this state on
# purpose: the gate is the demonstration, and the fix is a separate module.
#
# Measured here: 7 multiply-driven signals (u_dut.bram_inst.ram[0..6]), one per
# node, and 49 multiply-driven bits: 7 bits per word at DATA_WIDTH=3 (1 active +
# 3 value + 3 capacity). Quote the bit count with the width it was measured at.
#
# Nothing below has been validated against a converged run. MAX_SETTLE, the
# parameter sizes, and HAS_FULL are all first estimates; see the bind file.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/bram_tree/src/bram_tree.sv
source              hwpq/bram_tree/src/rams_tdp_rf_rf.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/baseline/bram_tree_baseline_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# QUEUE_SIZE must be 2^k - 1 for the tree designs. 7 gives TREE_DEPTH=3, which is
# the smallest size with a non-trivial descent.
#
# DATA_WIDTH 2, NOT the library default of 3. Sized up front so every run below
# is like-for-like and converges inside the ceiling. At width 3 the three spec
# properties that track a symbolic value through the whole queue (a_no_loss,
# a_head_is_max and a_head_present) do not converge in 1800 s. This module
# carries a capacity field per node on top of the payload, so it has strictly
# more state than a bare register design.
#
# It is a real reduction in strength, not a free choice: with both sentinels
# reserved the legal alphabet is 2**2 - 2 = TWO values, so an ordering property
# can tell a maximum from a non-maximum but cannot distinguish degrees among
# three or more payloads. Raising the ceiling instead is the wrong answer: a
# proof past the ceiling is mis-sized, not slow.
#
# The top is the reset harness, not the DUT: see the harness comment in
# formal/bind/baseline/bram_tree_baseline_bind.sv.
top                 hwpq_rst_bram_tree
param               QUEUE_SIZE 7
param               DATA_WIDTH 2

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# The BRAMs have no reset port and a formal tool ignores the `initial` block that
# fills them, so the memory starts arbitrary, including the per-node `capacity`
# fields that carry this design's entire free-space accounting. This config makes
# no assumption about that and sources no addendum: the baseline RTL has no reset
# sweep either, so failing to establish the memory is part of the behaviour being
# recorded. Read every result here as black-box only.

# ---- 4. prove, gate, exit ---------------------------------------------------
module              bram_tree_baseline
allow_bounded       0

# Empty on purpose. An expected-cex list is how a defect that is STAYING gets
# parked, not a running tally of work in progress.
expect_cex
