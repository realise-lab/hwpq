# Proof config: systolic_array, ready/accept gap characterisation
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# A white-box run rather than a second functional proof. It binds
# hwpq_systolic_aux only, without hwpq_spec, because the spec reconstructs "the
# DUT accepted this command" from the matching ready, which is the premise this
# run exists to measure. Binding both would score an off-ready accept as a
# refusal and fail the spec's ordering asserts on that premise rather than on
# the RTL, and a_no_enq_when_full would forbid the window outright.
#
# What it decides: how wide the ready/accept disagreement is, whether it is
# reachable, and what the queue's true capacity is as opposed to its advertised
# one.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/systolic_array/src/systolic_array.sv
source              formal/spec/hwpq_systolic_aux.sv
source              formal/bind/systolic_array_aux_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
top                 hwpq_rst_systolic_array
param               QUEUE_SIZE 8
param               DATA_WIDTH 3

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              systolic_array_gap
allow_bounded       0
# No workaround assumption applies here, so --ungated is a no-op and the
# property set must be clean in both modes.
expect_cex
