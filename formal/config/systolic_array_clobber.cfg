# Proof config: systolic_array, IB[0] clobber check
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# A white-box run rather than a second functional proof. It binds
# hwpq_systolic_clobber only, without hwpq_spec, because the spec reconstructs
# acceptance from the matching ready, and a_no_enq_when_full forbids precisely
# the writes this run exists to study.
#
# What it decides: whether a write can destroy a live value sitting in IB[0].
# Every enqueue and replace overwrites IB[0] unconditionally, and the shift
# chain that is supposed to have vacated it first depends on how much slack the
# queue keeps. Writes can land one slot past what the queue advertises; this
# says whether that costs anything.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/systolic_array/src/systolic_array.sv
source              formal/spec/hwpq_systolic_clobber.sv
source              formal/bind/systolic_array_clobber_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
top                 hwpq_rst_systolic_array
param               QUEUE_SIZE 8
param               DATA_WIDTH 3

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              systolic_array_clobber
allow_bounded       0
# No workaround assumption applies here: these properties hold with writes
# completely unconstrained, so the ungated run is a no-op.
expect_cex
