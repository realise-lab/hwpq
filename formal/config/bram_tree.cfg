# proof: bram_tree (enqueue-capable; both command forms live)

# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.


# 1. sources

source              hwpq/bram_tree/src/bram_tree.sv
source              hwpq/bram_tree/src/rams_tdp_rf_rf.sv
source              formal/spec/hwpq_spec.sv
source              formal/spec/hwpq_bram_tree_aux.sv
source              formal/bind/bram_tree_bind.sv

# 2. elaborate SMALL
# QUEUE_SIZE must be 2^k - 1 for the tree designs. 7 gives TREE_DEPTH=3, which is
# the smallest size with a non-trivial descent.

# DATA_WIDTH 2, NOT the formal default of 3. At width 3 the three spec
# properties that track a symbolic value through the whole queue (a_no_loss,
# a_head_is_max and a_head_present) do not converge in 1800 s. DATA_WIDTH 2
# leaves 2 legal payloads, so the ordering asserts cannot distinguish degrees --
# only ties are exercised.

# The top is the reset harness, not the DUT, to allow for mid-operation resets
top                 hwpq_rst_bram_tree
param               QUEUE_SIZE 7
param               DATA_WIDTH 2

# 3. time and reset
clock               i_CLK
reset               ~i_init_RSTn

# 4. prove, gate, exit
module              bram_tree
allow_bounded       0

# Empty on purpose. An expected-cex list is how a defect that is STAYING gets parked.
expect_cex
