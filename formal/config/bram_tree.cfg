# Proof config: bram_tree
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.

# ---- 1. sources -------------------------------------------------------------
source              hwpq/bram_tree/src/bram_tree_ram.sv
source              hwpq/bram_tree/src/bram_tree.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/bram_tree_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# QUEUE_SIZE must be 2^k - 1. DATA_WIDTH 2 leaves two legal payloads, so only ties are
# ordered; wider payloads keep the symbolic-value asserts from converging.
top                 hwpq_rst_bram_tree
param               QUEUE_SIZE 7
param               DATA_WIDTH 2

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              bram_tree
allow_bounded       0
# No workaround assumption applies here, so --ungated must be clean too.
expect_cex
