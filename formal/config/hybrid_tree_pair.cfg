# proof: the hybrid's bram_tree_pair against hybrid_tree_contract

# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.


# 1. sources
# Same sizes as hybrid_systolic_heap: the stand-in proof assumes this contract at that size.

source              formal/bind/hybrid_systolic_heap_defines.sv
source              hwpq/hybrid_systolic_bram_heap/src/hybrid_typedef.sv
