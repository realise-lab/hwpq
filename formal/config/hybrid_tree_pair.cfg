# invariant that carries order and the multiset across a cycle.
helper              a_tree_child_mirror a_tree_read_fresh a_tree_par_fresh a_tree_capacity a_tree_inactive_empty a_tree_top_max a_tree_conserve_all a_tree_size a_tree_insert_live
