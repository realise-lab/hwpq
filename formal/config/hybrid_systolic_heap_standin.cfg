# proof: hybrid_systolic_heap over stand-in trees that meet hybrid_tree_contract

# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.


# 1. sources
# hybrid_tree_pair proves bram_tree_pair meets the contract at these sizes; together the two
# proofs cover the whole hybrid. bram_tree.sv is listed for bram_tree_reset only.

source              formal/bind/hybrid_systolic_heap_defines.sv
source              hwpq/hybrid_systolic_bram_heap/src/hybrid_typedef.sv
source              hwpq/hybrid_systolic_bram_heap/src/bram_tree.sv
source              formal/spec/hybrid_tree_contract.sv
source              formal/bind/hybrid_tree_standin.sv
source              hwpq/hybrid_systolic_bram_heap/src/hybrid_systolic_heap.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/hybrid_systolic_heap_bind.sv
source              formal/spec/hwpq_hybrid_aux.sv

# 2. elaborate SMALL
top                 hwpq_rst_hybrid_systolic_heap

# 3. time and reset
clock               i_CLK
reset               ~i_init_RSTn

# 4. prove, gate, exit
module              hybrid_systolic_heap_standin
# White-box helpers, a stage per line: per-buffer and per-tree facts, then the counts that need
# each other, then the global facts and the ordering they support.
helper              a_owed_no_write a_max_is_top a_main_conserve_all a_main_conserve_tracked a_heap_conserve_all a_heap_conserve_tracked a_main_head_max a_heap_head_max a_read_head_max_buffers a_spill_moves a_evict_moves a_one_write a_model_shape a_idx_range a_model_no_ones a_taken_held a_owed_deep a_taken_elsewhere
helper              a_tree_conserve_all a_tree_conserve_tracked
helper              a_queue_inv
helper              a_no_ones a_main_forecast a_heap_forecast a_conserve_all a_conserve_tracked
helper              a_read_head_max_trees
allow_bounded       0
expect_cex
